[package]
name = "vimglide"
version = "0.1.0"
edition = "2024"
description = "系统级 Vim 风格提示导航（Windows 实现，预留 Linux/macOS 接口）"
license = "GPL-2.0-only"

[dependencies]
fontdue = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
