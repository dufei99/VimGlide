[package]
name = "vimglide"
version = "0.2.0"
edition = "2024"
description = "系统级 Vim 风格提示导航（Windows 实现，预留 Linux/macOS 接口）"
license = "GPL-2.0-only"

[dependencies]
fontdue = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    # 系统 OCR 兜底（Windows.Media.Ocr）
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Globalization",
    "Win32_Graphics_Imaging",
    "Win32_System_WinRT",
] }
# Direct2D 的接口签名使用这些数学类型，必须与 windows crate 内部的版本一致。
windows-numerics = "0.3.1"
# `OcrEngine::RecognizeAsync` 返回的异步类型与 AsyncStatus 由该 crate 提供。
windows-future = "0.3.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
